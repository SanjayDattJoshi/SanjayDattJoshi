<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanjay Datt Joshi GitHub stats"><title>GitHub Stats</title>
    <defs>
      <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a0b2e"/><stop offset="100%" stop-color="#2d1145"/>
      </linearGradient>
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff4fd8"/>
        <stop offset="100%" stop-color="#5ef7ff"/>
      </linearGradient>
      <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ff4fd8"/><stop offset="100%" stop-color="#9b5cff"/>
      </linearGradient>
      <filter id="g1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
      <clipPath id="rc"><rect x="0" y="0" width="480" height="200" rx="16"/></clipPath>
    </defs>
    <style>
      .row { opacity:0; animation: slideIn .6s ease forwards; }
      @keyframes slideIn { 0%{opacity:0; transform:translateX(-14px);} 100%{opacity:1; transform:translateX(0);} }
      .ring-anim { animation: ringPulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      @keyframes ringPulse { 0%,100%{ filter:drop-shadow(0 0 2px rgba(255,79,216,.5)); } 50%{ filter:drop-shadow(0 0 7px rgba(94,247,255,.7)); } }
      .rank-txt { opacity:0; animation: fadeIn 1s ease 1.4s forwards; }
      @keyframes fadeIn { to { opacity:1; } }
    </style><g clip-path="url(#rc)"><rect width="480" height="200" fill="url(#sBg)"/><rect x="1" y="1" width="478" height="198" rx="15" fill="none" stroke="#a45cff" stroke-opacity="0.5"/><text x="20" y="30" font-size="15" font-weight="700" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">Sanjay's GitHub Stats</text><circle class="ring-anim" cx="404" cy="104" r="46" fill="none" stroke="#2a1440" stroke-width="10"/><circle class="ring-anim" cx="404" cy="104" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="289.0" stroke-dashoffset="289.0" transform="rotate(-90 404 104)"><animate attributeName="stroke-dashoffset" from="289.0" to="40.5" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/></circle><text class="rank-txt" x="404" y="112" text-anchor="middle" font-size="26" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">A-</text><text x="404" y="156" text-anchor="middle" font-size="11" letter-spacing="2" fill="#8f76a8" font-family="Segoe UI,Arial,sans-serif">RANK</text><g class="row" style="animation-delay:0.00s"><text x="20" y="54" font-size="11.5" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Total Commits</text><text x="344" y="54" text-anchor="end" font-size="11.5" font-weight="700" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">640</text><rect x="20" y="60" width="324" height="7" rx="3.5" fill="#2a1440"/><rect x="20" y="60" height="7" rx="3.5" fill="url(#barGrad)" filter="url(#g1)"><animate attributeName="width" from="0" to="207.4" dur="1.1s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/></rect></g><g class="row" style="animation-delay:0.15s"><text x="20" y="84" font-size="11.5" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Repositories</text><text x="344" y="84" text-anchor="end" font-size="11.5" font-weight="700" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">24</text><rect x="20" y="90" width="324" height="7" rx="3.5" fill="#2a1440"/><rect x="20" y="90" height="7" rx="3.5" fill="url(#barGrad)" filter="url(#g1)"><animate attributeName="width" from="0" to="194.4" dur="1.1s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/></rect></g><g class="row" style="animation-delay:0.30s"><text x="20" y="114" font-size="11.5" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">DSA Problems Solved</text><text x="344" y="114" text-anchor="end" font-size="11.5" font-weight="700" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">310</text><rect x="20" y="120" width="324" height="7" rx="3.5" fill="#2a1440"/><rect x="20" y="120" height="7" rx="3.5" fill="url(#barGrad)" filter="url(#g1)"><animate attributeName="width" from="0" to="200.9" dur="1.1s" begin="0.80s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/></rect></g><g class="row" style="animation-delay:0.45s"><text x="20" y="144" font-size="11.5" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Current Streak (days)</text><text x="344" y="144" text-anchor="end" font-size="11.5" font-weight="700" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">18</text><rect x="20" y="150" width="324" height="7" rx="3.5" fill="#2a1440"/><rect x="20" y="150" height="7" rx="3.5" fill="url(#barGrad)" filter="url(#g1)"><animate attributeName="width" from="0" to="97.2" dur="1.1s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1"/></rect></g></g></svg>