name: Generate Snake Animation

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate a pink/purple snake game from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: SanjayDattJoshi
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-dark.svg?color_snake=#ff4fd8&color_dots=#2a1440,#7b2ff7,#9b5cff,#ff4fd8,#5ef7ff
            dist/github-snake-light.svg?color_snake=#c81fa8&color_dots=#f0e0fa,#e5c3f7,#c98af0,#c81fa8,#8f3ff0
            dist/github-snake.gif?color_snake=#ff4fd8&color_dots=#2a1440,#7b2ff7,#9b5cff,#ff4fd8,#5ef7ff

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
