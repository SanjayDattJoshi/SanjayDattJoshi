<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanjay Datt Joshi GitHub trophies"><title>GitHub Trophies</title><defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/><stop offset="100%" stop-color="#2d1145"/>
    </linearGradient>
    <clipPath id="trc"><rect x="0" y="0" width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="shine2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tg1" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <style>
      .cell { opacity:0; animation: popCell .55s cubic-bezier(.2,1.5,.4,1) forwards; transform-box: fill-box; transform-origin:center; }
      @keyframes popCell { 0%{opacity:0; transform:scale(.5) translateY(14px);} 70%{opacity:1; transform:scale(1.06) translateY(-2px);} 100%{opacity:1; transform:scale(1) translateY(0);} }
      .trophy-glow { animation: tglow 2.6s ease-in-out infinite; }
      @keyframes tglow { 0%,100%{ opacity:.75; } 50%{ opacity:1; } }
      .rank-badge { animation: rspin 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
      @keyframes rspin { 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(6deg); } }
    </style><g clip-path="url(#trc)"><rect width="800" height="200" fill="url(#tBg)"/><rect x="1" y="1" width="798" height="198" rx="15" fill="none" stroke="#a45cff" stroke-opacity="0.5"/><g class="cell" style="animation-delay:0.00s"><g class="trophy-glow" transform="translate(66.66666666666667,72) scale(1.9)" filter="url(#tg1)"><path d="M-10,-14 h20 v6 a10,10 0 0 1 -8,9.8 V6 h-4 V1.8 A10,10 0 0 1 -10,-8 Z" fill="#ff4fd8"/><path d="M-10,-12 a-7,7 0 0 0 0,14" fill="none" stroke="#ff4fd8" stroke-width="2"/><path d="M10,-12 a7,7 0 0 1 0,14" fill="none" stroke="#ff4fd8" stroke-width="2"/><rect x="-5" y="6" width="10" height="4" fill="#ff4fd8"/><rect x="-8" y="10" width="16" height="3.4" rx="1.4" fill="#ff4fd8"/></g><g class="rank-badge"><circle cx="66.66666666666667" cy="118" r="15" fill="none" stroke="#ff4fd8" stroke-width="2.2"/><text x="66.66666666666667" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">A</text></g><text x="66.66666666666667" y="152" text-anchor="middle" font-size="12" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Commits</text></g><g class="cell" style="animation-delay:0.12s"><line x1="133.3" y1="20" x2="133.3" y2="180" stroke="#a45cff" stroke-opacity="0.25"/><g class="trophy-glow" transform="translate(200.0,72) scale(1.9)" filter="url(#tg1)"><path d="M-10,-14 h20 v6 a10,10 0 0 1 -8,9.8 V6 h-4 V1.8 A10,10 0 0 1 -10,-8 Z" fill="#ffbd2e"/><path d="M-10,-12 a-7,7 0 0 0 0,14" fill="none" stroke="#ffbd2e" stroke-width="2"/><path d="M10,-12 a7,7 0 0 1 0,14" fill="none" stroke="#ffbd2e" stroke-width="2"/><rect x="-5" y="6" width="10" height="4" fill="#ffbd2e"/><rect x="-8" y="10" width="16" height="3.4" rx="1.4" fill="#ffbd2e"/></g><g class="rank-badge"><circle cx="200.0" cy="118" r="15" fill="none" stroke="#ffbd2e" stroke-width="2.2"/><text x="200.0" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">B+</text></g><text x="200.0" y="152" text-anchor="middle" font-size="12" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Stars</text></g><g class="cell" style="animation-delay:0.24s"><line x1="266.7" y1="20" x2="266.7" y2="180" stroke="#a45cff" stroke-opacity="0.25"/><g class="trophy-glow" transform="translate(333.33333333333337,72) scale(1.9)" filter="url(#tg1)"><path d="M-10,-14 h20 v6 a10,10 0 0 1 -8,9.8 V6 h-4 V1.8 A10,10 0 0 1 -10,-8 Z" fill="#5ef7ff"/><path d="M-10,-12 a-7,7 0 0 0 0,14" fill="none" stroke="#5ef7ff" stroke-width="2"/><path d="M10,-12 a7,7 0 0 1 0,14" fill="none" stroke="#5ef7ff" stroke-width="2"/><rect x="-5" y="6" width="10" height="4" fill="#5ef7ff"/><rect x="-8" y="10" width="16" height="3.4" rx="1.4" fill="#5ef7ff"/></g><g class="rank-badge"><circle cx="333.33333333333337" cy="118" r="15" fill="none" stroke="#5ef7ff" stroke-width="2.2"/><text x="333.33333333333337" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">A-</text></g><text x="333.33333333333337" y="152" text-anchor="middle" font-size="12" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Pull Requests</text></g><g class="cell" style="animation-delay:0.36s"><line x1="400.0" y1="20" x2="400.0" y2="180" stroke="#a45cff" stroke-opacity="0.25"/><g class="trophy-glow" transform="translate(466.6666666666667,72) scale(1.9)" filter="url(#tg1)"><path d="M-10,-14 h20 v6 a10,10 0 0 1 -8,9.8 V6 h-4 V1.8 A10,10 0 0 1 -10,-8 Z" fill="#7CFF9B"/><path d="M-10,-12 a-7,7 0 0 0 0,14" fill="none" stroke="#7CFF9B" stroke-width="2"/><path d="M10,-12 a7,7 0 0 1 0,14" fill="none" stroke="#7CFF9B" stroke-width="2"/><rect x="-5" y="6" width="10" height="4" fill="#7CFF9B"/><rect x="-8" y="10" width="16" height="3.4" rx="1.4" fill="#7CFF9B"/></g><g class="rank-badge"><circle cx="466.6666666666667" cy="118" r="15" fill="none" stroke="#7CFF9B" stroke-width="2.2"/><text x="466.6666666666667" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">B</text></g><text x="466.6666666666667" y="152" text-anchor="middle" font-size="12" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Issues</text></g><g class="cell" style="animation-delay:0.48s"><line x1="533.3" y1="20" x2="533.3" y2="180" stroke="#a45cff" stroke-opacity="0.25"/><g class="trophy-glow" transform="translate(600.0,72) scale(1.9)" filter="url(#tg1)"><path d="M-10,-14 h20 v6 a10,10 0 0 1 -8,9.8 V6 h-4 V1.8 A10,10 0 0 1 -10,-8 Z" fill="#9b5cff"/><path d="M-10,-12 a-7,7 0 0 0 0,14" fill="none" stroke="#9b5cff" stroke-width="2"/><path d="M10,-12 a7,7 0 0 1 0,14" fill="none" stroke="#9b5cff" stroke-width="2"/><rect x="-5" y="6" width="10" height="4" fill="#9b5cff"/><rect x="-8" y="10" width="16" height="3.4" rx="1.4" fill="#9b5cff"/></g><g class="rank-badge"><circle cx="600.0" cy="118" r="15" fill="none" stroke="#9b5cff" stroke-width="2.2"/><text x="600.0" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">A</text></g><text x="600.0" y="152" text-anchor="middle" font-size="12" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Repositories</text></g><g class="cell" style="animation-delay:0.60s"><line x1="666.7" y1="20" x2="666.7" y2="180" stroke="#a45cff" stroke-opacity="0.25"/><g class="trophy-glow" transform="translate(733.3333333333334,72) scale(1.9)" filter="url(#tg1)"><path d="M-10,-14 h20 v6 a10,10 0 0 1 -8,9.8 V6 h-4 V1.8 A10,10 0 0 1 -10,-8 Z" fill="#ff8a5c"/><path d="M-10,-12 a-7,7 0 0 0 0,14" fill="none" stroke="#ff8a5c" stroke-width="2"/><path d="M10,-12 a7,7 0 0 1 0,14" fill="none" stroke="#ff8a5c" stroke-width="2"/><rect x="-5" y="6" width="10" height="4" fill="#ff8a5c"/><rect x="-8" y="10" width="16" height="3.4" rx="1.4" fill="#ff8a5c"/></g><g class="rank-badge"><circle cx="733.3333333333334" cy="118" r="15" fill="none" stroke="#ff8a5c" stroke-width="2.2"/><text x="733.3333333333334" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#f5ecff" font-family="Segoe UI,Arial,sans-serif">B+</text></g><text x="733.3333333333334" y="152" text-anchor="middle" font-size="12" fill="#c9a9e0" font-family="Segoe UI,Arial,sans-serif">Followers</text></g><g style="mix-blend-mode:screen"><rect x="-480" y="0" width="480" height="200" fill="url(#shine2)" transform="skewX(-18)"><animate attributeName="x" from="-480" to="800" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></rect></g></g></svg>